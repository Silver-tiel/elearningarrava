name: Laravel CI - Fitur Login Dashboard

on:
  push:
    branches: [ "main", "master", "Linthelakea-patch-1" ]
  pull_request:
    branches: [ "main", "master", "Linthelakea-patch-1" ]

jobs:
  login-dashboard-tests:
    name: Test Fitur Login dan Dashboard UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate

      - name: Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Test Fitur Login & Dashboard (UI)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test tests/Feature/LoginDashboardTest.php
