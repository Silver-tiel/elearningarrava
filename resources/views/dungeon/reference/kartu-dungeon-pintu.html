<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Masuk Dungeon (gambar pintu)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e3f4ff; --surface:#f7fcff; --ink:#0f3a5f; --muted:#4f7292; --soft:#e8f6ff; --pip:#cfe9fb;
  --btn:#38bdf8; --ok:#34d399; --lock:#fbbf24; --stair:#38bdf8; --bubble:#fff4cc; --bubble-ink:#6b4a00; --rekor:#b45309; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1b2b; --surface:#12304a; --ink:#e9f6ff; --muted:#9cc0dc; --soft:#17405f; --pip:#245270;
    --bubble:#4a3a12; --bubble-ink:#ffdc8a; --rekor:#fbbf24; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1b2b; --surface:#12304a; --ink:#e9f6ff; --muted:#9cc0dc; --soft:#17405f; --pip:#245270;
  --bubble:#4a3a12; --bubble-ink:#ffdc8a; --rekor:#fbbf24; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px}
svg{display:block}
h2{font-family:"Fredoka","Nunito",system-ui,sans-serif}
.card{--edge:#0f3a5f;width:100%;max-width:400px;background:var(--surface);border:4px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{--edge:#06131f}}
:root[data-theme="dark"] .card{--edge:#06131f}

.scene{position:relative;display:block;width:100%;height:230px;padding:0;border:0;border-bottom:4px solid var(--edge);background:#9bd4f3;cursor:pointer;overflow:hidden}
.scene img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;display:block;transition:transform .5s ease,filter .4s}
.scene:hover img{transform:scale(1.05)}
.locked .scene img{filter:grayscale(1) brightness(.78)}
.locked .scene:hover img{transform:none}
.scene:focus-visible{outline:4px solid #0ea5e9;outline-offset:-8px}
.pill{position:absolute;top:12px;right:12px;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:3px solid var(--edge);border-radius:999px;background:var(--ok);color:#053d27;font-size:13px;font-weight:800}
.locked .pill{background:var(--lock);color:#3b2a00}
.padlock{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:60px;height:60px;display:none;place-items:center;border:4px solid var(--edge);border-radius:50%;background:var(--lock);color:#3b2a00}
.locked .padlock{display:grid}

.body{padding:0 20px 22px}
.hero{position:relative}
.scene::after{content:"";position:absolute;inset:auto 0 0 0;height:68%;background:linear-gradient(transparent,rgba(8,30,50,.78));pointer-events:none}
.head{position:absolute;left:20px;right:20px;bottom:16px;pointer-events:none}
.medal{flex:none;width:64px;height:64px;display:grid;place-items:center;border:4px solid var(--edge);border-radius:20px;background:#fff;color:#0ea5e9}
.titles{min-width:0}
.title{margin:0;font-size:24px;line-height:1.15;font-weight:700;color:#fff;text-shadow:0 2px 0 #0f3a5f,0 0 10px rgba(8,30,50,.55)}
.sub{margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.92);text-shadow:0 1px 0 #0f3a5f,0 0 8px rgba(8,30,50,.55)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{padding:10px 6px 11px;border:3px solid var(--edge);border-radius:18px;background:var(--soft);text-align:center}
.stat .l{font-size:12px;color:var(--muted)}
.stat .v{font-family:"Fredoka",sans-serif;font-size:20px;font-weight:600;line-height:1.3}
.stat .v small{font-size:12px;font-weight:700;color:var(--muted)}
.floors{margin-top:16px}
.floors-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.floors-top b{color:var(--ink)}
.stairs{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:8px}
.stairs i{flex:1;border:2.5px solid var(--edge);border-radius:6px 6px 3px 3px;background:var(--pip)}
.stairs i.on{background:var(--stair)}
.locked .stairs i.on{background:var(--muted)}
.bubble{position:relative;margin-top:18px;padding:11px 14px;border:3px solid var(--edge);border-radius:16px;background:var(--bubble);color:var(--bubble-ink);font-size:14px;line-height:1.4}
.bubble::before{content:"";position:absolute;top:-10px;left:28px;width:15px;height:15px;background:inherit;border-left:3px solid var(--edge);border-top:3px solid var(--edge);transform:rotate(45deg)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:18px;border:3px solid var(--edge);border-radius:18px;background:var(--btn);color:#0f3a5f;font:inherit;font-family:"Fredoka",sans-serif;font-size:19px;font-weight:600;box-shadow:0 6px 0 var(--edge);cursor:pointer;transition:transform .08s,box-shadow .08s;animation:glow 2s ease-in-out infinite}
.go:hover{filter:brightness(1.05)}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--edge)}
.go:focus-visible,.seg button:focus-visible{outline:4px solid #0ea5e9;outline-offset:3px}
.locked .go{background:var(--pip);color:var(--muted);animation:none;cursor:not-allowed;box-shadow:0 3px 0 var(--edge)}
.locked .go:active{transform:none;box-shadow:0 3px 0 var(--edge)}
@keyframes glow{50%{filter:drop-shadow(0 0 10px rgba(56,189,248,.9))}}
.seg{display:inline-flex;padding:4px;gap:4px;background:var(--surface);border:3px solid var(--ink);border-radius:14px}
.seg button{font:inherit;font-size:13px;font-weight:800;color:var(--muted);background:none;border:0;padding:7px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:#0f3a5f}
.hint{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const STAR='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z"/></svg>';
const FLOORS=10;
let cur=DATA[0];
function update(d){
  cur=d;
  $("card").classList.toggle("locked",!!d.locked);
  $("scene").setAttribute("aria-label",d.locked?"Dungeon terkunci":"Masuk dungeon");
  $("total").innerHTML=d.total+' <small>soal</small>';
  $("rekor").textContent=fmt(d.rekor);
  $("lt").textContent="Lt. "+d.lt;
  $("ft").textContent="Lt. "+d.lt+" dari "+FLOORS;
  $("stairs").innerHTML=Array.from({length:FLOORS},(_,i)=>`<i class="${i<d.lt?"on":""}" style="height:${28+i*7.2}%"></i>`).join("");
  $("go").innerHTML=d.locked?LOCK+"Belum bisa masuk":GAME+"Masuk Dungeon";
  $("go").setAttribute("aria-disabled",!!d.locked);
  $("msg").innerHTML=d.locked
    ?"<b>Pintunya masih terkunci.</b> Soalnya belum cukup, minta gurumu menambah soal dulu ya!"
    :d.rekor
    ?`<b>Rekormu ${fmt(d.rekor)}!</b> Bisa naik ke Lt. ${d.lt+1} dan memecahkannya?`
    :"<b>Belum ada rekor.</b> Ayo buka pintunya dan jadi yang pertama menaklukkan Lt. 1!";
}
let tm;const toast=$("toast");
function say(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tm);tm=setTimeout(()=>toast.classList.remove("show"),1700)}
function enter(){say(cur.locked?"Dungeon belum terbuka. Soalnya belum cukup.":"Membuka pintu dungeon…")}
$("go").addEventListener("click",enter);$("scene").addEventListener("click",enter);
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  update(DATA[+b.dataset.s]);
}));
update(DATA[0]);
</script>
</body>
</html>
